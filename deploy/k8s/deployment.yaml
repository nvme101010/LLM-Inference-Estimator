apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-inference-estimator
  labels:
    app.kubernetes.io/name: llm-inference-estimator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-inference-estimator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-inference-estimator
    spec:
      # The image runs as the nginx user (uid 101) with its pid file and caches under /tmp,
      # so the root filesystem can be read-only and /tmp a small in-memory volume.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: estimator
          image: ghcr.io/nvme101010/llm-inference-estimator:1.9.0
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # One static file and two nginx workers: a few MB and almost no CPU.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 32Mi
          # nginx binds its port well within a second; the short delay avoids one logged
          # "connection refused" on every pod start
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
