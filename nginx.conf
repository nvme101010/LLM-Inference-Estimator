# Serves the estimator on 8080. Replaces the image's default server block.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The page is ~170 KB of text; gzip brings it to ~65 KB.
    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary       on;

    # One file with no hashed assets: let browsers keep it but revalidate every time.
    # nginx sends ETag and Last-Modified, so an unchanged file answers with a 304.
    add_header Cache-Control "no-cache" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The page has inline <style> and <script>, loads its two fonts from Google Fonts,
    # and makes no network requests of its own.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # Liveness for the image HEALTHCHECK and for orchestrators.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # nginx drops server-level add_header lines inside a location that sets its own,
    # so this one sets none: every response here carries the headers above.
    location / {
        try_files $uri $uri/ =404;
    }
}
