# Builds the container on every pull request and smoke-tests it. On a push to main
# or a v* tag, publishes it to GHCR as ghcr.io/<owner>/llm-inference-estimator
# for linux/amd64 and linux/arm64.
name: Container

on:
  pull_request:
    paths: [Dockerfile, nginx.conf, index.html, .dockerignore, .github/workflows/container.yml]
  push:
    branches: [main]
    tags: ["v*"]
    paths: [Dockerfile, nginx.conf, index.html, .dockerignore, .github/workflows/container.yml]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/llm-inference-estimator

jobs:
  test:
    name: Build and smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build for this runner
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: estimator:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it the way compose.yaml does and check it answers
        run: |
          docker run -d --name estimator -p 8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            estimator:test
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsSI http://localhost:8080/ | grep -i '^content-security-policy:'
          curl -fsSI -H 'Accept-Encoding: gzip' http://localhost:8080/ | grep -i '^content-encoding: gzip'
          test "$(docker exec estimator id -u)" = "101"
          docker logs estimator
          docker rm -f estimator

  publish:
    name: Publish to GHCR
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main → :latest and :sha-<short>; a tag v1.2.3 → :1.2.3, :1.2 and :latest
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
